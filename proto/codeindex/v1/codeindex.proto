syntax = "proto3";

package codeindex.v1;

option go_package = "buf.build/gen/go/tldiagramcom/diagram/protocolbuffers/go/codeindex/v1;codeindexv1";

// Codeindex exposes an immutable, snapshot-scoped code graph. A CodeFact is a
// code-bearing declaration; an EdgeFact is one observed relationship between
// CodeFacts. Stable logical keys join CodeFacts and EdgeFacts across snapshots,
// so consumers can diff revisions, trace observations, and carry analysis
// results forward. The indexer produces this data in-process; it does not infer
// architecture, and diagram conversion is deterministic and lives downstream.
//
// These messages were folded into tld from the standalone codeindex project.
// The gRPC IndexService is intentionally omitted: indexing is invoked through
// in-process Go interfaces, not over the wire.

// Zero-based UTF-8 byte offsets; end positions are exclusive.
message SourceAnchor {
  string path = 1;
  uint32 start_byte = 2;
  uint32 end_byte = 3;
  uint32 start_line = 4;
  uint32 start_column = 5;
  uint32 end_line = 6;
  uint32 end_column = 7;
  string source_hash = 8;
}
message Evidence {
  string producer = 1;
  string version = 2;
  string original_id = 3;
  string original_range = 4;
  SourceAnchor anchor = 5;
  string derivation = 6;
}
enum FactKind {
  FACT_KIND_UNSPECIFIED = 0;
  FACT_KIND_FUNCTION = 1;
  FACT_KIND_METHOD = 2;
  FACT_KIND_CLASS = 3;
  FACT_KIND_STRUCT = 4;
  FACT_KIND_INTERFACE = 5;
  FACT_KIND_ENUM = 6;
  FACT_KIND_TYPE = 7;
  FACT_KIND_CONSTRUCTOR = 8;
  // Infrastructure, configuration, and repository-level facts. These carry a
  // subject/object pair rather than a captured code body and are produced by
  // deterministic config scanners, not the code indexers.
  FACT_KIND_DEPLOYABLE = 20;
  FACT_KIND_DEPENDENCY = 21;
  FACT_KIND_ROUTE = 22;
  FACT_KIND_OUTBOUND = 23;
  FACT_KIND_DATASTORE = 24;
  FACT_KIND_QUEUE = 25;
  FACT_KIND_TOPIC = 26;
  FACT_KIND_ENV = 27;
  FACT_KIND_ENTRYPOINT = 28;
  FACT_KIND_CATALOG_COMPONENT = 30;
  FACT_KIND_WORKSPACE_MEMBER = 31;
  FACT_KIND_RPC = 32;
  FACT_KIND_PERSON = 33;
  FACT_KIND_BRIDGE_HTTP = 34;
  FACT_KIND_IMPORT = 39;
  FACT_KIND_CONFIG_REF = 43;
  FACT_KIND_DB_CLIENT = 47;
  FACT_KIND_SCHEMA = 48;
}
// Only captured code-bearing declarations are published as CodeFacts.
message CodeFact {
  string id = 1;
  string repository_id = 2;
  string snapshot_id = 3;
  string language = 4;
  SourceAnchor anchor = 5;
  FactKind kind = 6;
  string name = 7;
  string qualified_name = 8;
  string symbol_key = 9;
  string signature = 10;
  string documentation = 11;
  string code = 12;
  string parent_fact_id = 13;
  repeated Evidence evidence = 14;
  // Import paths declared by the fact's source file, in declaration order.
  repeated string imports = 15;
  // Stable identity that survives across snapshots, enabling cross-snapshot joins.
  string logical_key = 16;
}
message Chunk {
  string id = 1;
  string fact_id = 2;
  string snapshot_id = 3;
  SourceAnchor anchor = 4;
  string text = 5;
  string context = 6;
  uint32 index = 7;
  uint32 total = 8;
}
enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_REFERENCES = 1;
  EDGE_KIND_CALLS = 2;
  EDGE_KIND_IMPLEMENTS = 3;
  EDGE_KIND_TYPE_DEFINITION = 4;
}
// One observed relationship, including its site and unresolved target key.
message EdgeFact {
  string id = 1;
  string repository_id = 2;
  string snapshot_id = 3;
  EdgeKind kind = 4;
  string from_fact_id = 5;
  string to_fact_id = 6;
  string target_symbol_key = 7;
  SourceAnchor anchor = 8;
  repeated Evidence evidence = 9;
  // Stable identity across snapshots: kind|from-logical-key|target-logical-key.
  string logical_key = 10;
  // Observation count for this logical edge (separate observations remain separate records).
  double weight = 11;
}
message Embedding {
  string id = 1;
  string chunk_id = 2;
  string snapshot_id = 3;
  string profile = 4;
  string model = 5;
  uint32 dimensions = 6;
  string input_hash = 7;
  repeated float vector = 8;
  // Owning CodeFact, stored as a record link to code_fact.
  string fact_id = 9;
}
message Project {
  string root = 1;
  string language = 2;
  string config_path = 3;
}
message SourceFile {
  string path = 1;
  string hash = 2;
  uint64 size = 3;
}
message Repository {
  string id = 1;
  string root = 2;
  string latest_snapshot_id = 3;
}
// RepositorySummary is a repository plus a summary of its latest snapshot, for
// listing indexed repositories in a UI.
message RepositorySummary {
  string id = 1;
  string root = 2;
  string latest_snapshot_id = 3;
  int64 latest_created_unix = 4;
  string git_revision = 5;
  string git_branch = 6;
  uint32 facts = 7;
  uint32 chunks = 8;
  uint32 edges = 9;
  uint32 sources = 10;
}
message ListRepositoriesRequest {}
message ListRepositoriesResponse {
  repeated RepositorySummary repositories = 1;
}
// RepositoryService lists the repositories indexed by the in-process codeindex
// engine. Indexing itself is invoked through Go interfaces / the CLI.
service RepositoryService {
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
}
// Snapshot is an immutable indexed revision of a repository. It is published
// only after ingestion completes, and the repository's latest pointer advances
// to it.
message Snapshot {
  string id = 1;
  string repository_id = 2;
  int64 created_unix = 3;
  string git_revision = 4;
  repeated Project projects = 5;
  repeated SourceFile sources = 6;
  string ingestion_status = 7;
  string embedding_status = 8;
  repeated string warnings = 9;
  map<string, string> tool_versions = 10;
  string config_hash = 11;
  // Git branch the working tree was on when the snapshot was captured.
  string git_branch = 12;
}
message IndexRequest {
  string directory = 1;
  repeated string project_roots = 2;
  repeated string exclude = 3;
  map<string, string> scip_artifacts = 4;
  bool detached = 5;
  // When true and the repository has a published snapshot, facts, chunks, and
  // edges for sources whose content is unchanged are carried forward. An
  // indexer re-runs only for projects with changed sources, and its unchanged
  // documents are skipped. A snapshot with no changes is reused verbatim.
  bool incremental = 6;
}
message Job {
  string id = 1;
  string repository_id = 2;
  string snapshot_id = 3;
  string state = 4;
  string stage = 5;
  string error = 6;
  repeated string warnings = 7;
  int64 started_unix = 8;
  int64 finished_unix = 9;
}
message JobID { string id = 1; }
message SnapshotID { string id = 1; }
message RepositoryID { string id = 1; }
message ListSnapshotsResponse { repeated Snapshot snapshots = 1; }
message CodeFactID { string id = 1; }
message CodeFactFilter {
  string repository_id = 1;
  string snapshot_id = 2;
  string language = 3;
  FactKind kind = 4;
  string path_prefix = 5;
  uint32 page_size = 6;
  string page_token = 7;
  // When set, returns every snapshot's version of this logical CodeFact.
  string logical_key = 8;
}
message CodeFactPage {
  repeated CodeFact facts = 1;
  string next_page_token = 2;
}
message EdgeFactID { string id = 1; }
message EdgeFactFilter {
  string repository_id = 1;
  string snapshot_id = 2;
  string from_fact_id = 3;
  string to_fact_id = 4;
  EdgeKind kind = 5;
  string path_prefix = 6;
  uint32 page_size = 7;
  string page_token = 8;
  // When set, returns every snapshot's observation of this logical EdgeFact,
  // ordered by snapshot. Repeated observations remain separate records.
  string logical_key = 9;
}
message EdgeFactPage {
  repeated EdgeFact edge_facts = 1;
  string next_page_token = 2;
}
message SourceRequest {
  string repository_id = 1;
  string snapshot_id = 2;
  SourceAnchor anchor = 3;
}
message SourceResponse {
  bytes content = 1;
  SourceAnchor anchor = 2;
}
message SymbolQuery {
  string repository_id = 1;
  string snapshot_id = 2;
  string symbol_key = 3;
  string fact_id = 4;
  uint32 page_size = 5;
  string page_token = 6;
}
message GraphRequest {
  string repository_id = 1;
  string snapshot_id = 2;
  string fact_id = 3;
  uint32 depth = 4;
  uint32 limit = 5;
  // Additional traversal seeds. fact_id, when set, is included.
  repeated string fact_ids = 6;
  // Edge kinds to follow. Empty follows every kind.
  repeated EdgeKind kinds = 7;
  Direction direction = 8;
}
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  // Follow edges from source to target (dependency / forward reachability).
  DIRECTION_OUTBOUND = 1;
  // Follow edges from target to source (impact / reverse reachability).
  DIRECTION_INBOUND = 2;
}
message Graph {
  repeated CodeFact facts = 1;
  repeated EdgeFact edge_facts = 2;
  bool truncated = 5;
}
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_REMOVED = 2;
  CHANGE_KIND_MODIFIED = 3;
}
message SourceChange {
  string path = 1;
  ChangeKind change = 2;
  string from_hash = 3;
  string to_hash = 4;
}
// Deltas are keyed by stable logical identity, so a rename is an add plus a
// remove and a changed body is a modification.
message CodeFactDelta {
  repeated CodeFact added = 1;
  repeated CodeFact removed = 2;
  repeated CodeFact modified = 3;
}
// EdgeFactDelta compares relationships at the logical-edge level. A logical
// edge present in both snapshots is modified when its observation count changes.
message EdgeFactDelta {
  repeated EdgeFact added = 1;
  repeated EdgeFact removed = 2;
  repeated EdgeFact modified = 3;
}
message SnapshotDiffRequest {
  string repository_id = 1;
  string from_snapshot_id = 2;
  string to_snapshot_id = 3;
  // When true, source changes are returned and CodeFact/EdgeFact deltas are omitted.
  bool sources_only = 4;
}
message SnapshotDiff {
  string repository_id = 1;
  string from_snapshot_id = 2;
  string to_snapshot_id = 3;
  string from_git_revision = 4;
  string to_git_revision = 5;
  repeated SourceChange sources = 6;
  CodeFactDelta facts = 7;
  EdgeFactDelta edge_facts = 8;
}
// EdgeAggregate collapses one snapshot's observations of a relationship into a
// single edge. It is the unit a consumer promotes into a diagram edge: one
// relationship with a weight and every observation retained for tracing.
message EdgeAggregate {
  string logical_key = 1;
  EdgeKind kind = 2;
  string from_fact_id = 3;
  string to_fact_id = 4;
  string target_symbol_key = 5;
  // Aggregated observation count for this logical edge.
  double weight = 6;
  uint32 observation_count = 7;
  // Every retained observation with its anchor and evidence, for tracing.
  repeated EdgeFact observations = 8;
  bool observations_truncated = 9;
}
message EdgeAggregatePage {
  repeated EdgeAggregate edges = 1;
  string next_page_token = 2;
}
enum GroupKind {
  GROUP_KIND_UNSPECIFIED = 0;
  GROUP_KIND_COMMUNITY = 1;
  GROUP_KIND_CLUSTER = 2;
}
// AnalysisRun records the provenance of a model- or algorithm-produced grouping
// so multiple algorithms and parameterisations can coexist and be compared.
message AnalysisRun {
  string id = 1;
  string repository_id = 2;
  string snapshot_id = 3;
  string algorithm = 4;
  // Stringified parameters; numeric and boolean values are preserved as text.
  map<string, string> params = 5;
  int64 created_unix = 6;
}
message AnalysisRunFilter {
  string repository_id = 1;
  string snapshot_id = 2;
  string algorithm = 3;
  uint32 page_size = 4;
  string page_token = 5;
}
message AnalysisRunPage {
  repeated AnalysisRun runs = 1;
  string next_page_token = 2;
}
// Group is one community or semantic cluster produced by an analysis run.
message Group {
  string id = 1;
  string run_id = 2;
  string snapshot_id = 3;
  string label = 4;
  GroupKind kind = 5;
  // Embedding profile for clusters; empty for communities.
  string profile = 6;
  uint32 size = 7;
  // Member CodeFact ids. Present on Save; omitted by ListGroups.
  repeated string fact_ids = 8;
}
message GroupFilter {
  string repository_id = 1;
  string snapshot_id = 2;
  string run_id = 3;
  GroupKind kind = 4;
  uint32 page_size = 5;
  string page_token = 6;
}
message GroupPage {
  repeated Group groups = 1;
  string next_page_token = 2;
}
message GroupFactsRequest {
  string run_id = 1;
  string group_id = 2;
  uint32 page_size = 3;
  string page_token = 4;
}
message AnalysisRequest {
  string repository_id = 1;
  string snapshot_id = 2;
  string algorithm = 3;
  map<string, string> params = 4;
  repeated Group groups = 5;
}
message AnalysisResult {
  AnalysisRun run = 1;
  uint32 communities = 2;
  uint32 clusters = 3;
}
// CodeFactService serves the immutable code graph produced by the in-process
// indexer. Indexing itself is invoked through Go interfaces, not this service.
service CodeFactService {
  rpc GetFact(CodeFactID) returns (CodeFact);
  rpc ListFacts(CodeFactFilter) returns (CodeFactPage);
  rpc GetEdgeFact(EdgeFactID) returns (EdgeFact);
  rpc ListEdgeFacts(EdgeFactFilter) returns (EdgeFactPage);
  rpc GetSource(SourceRequest) returns (SourceResponse);
  rpc ResolveSymbol(SymbolQuery) returns (CodeFactPage);
  rpc FindDefinitions(SymbolQuery) returns (CodeFactPage);
  rpc FindReferences(SymbolQuery) returns (EdgeFactPage);
  rpc Traverse(GraphRequest) returns (Graph);
  // Groups a snapshot's EdgeFacts by logical identity into one edge per
  // relationship, retaining every observation for tracing.
  rpc AggregateEdges(EdgeFactFilter) returns (EdgeAggregatePage);
  rpc ListSnapshots(RepositoryID) returns (ListSnapshotsResponse);
  rpc GetRepository(RepositoryID) returns (Repository);
  rpc DiffSnapshots(SnapshotDiffRequest) returns (SnapshotDiff);
}
message SearchRequest {
  CodeFactFilter filter = 1;
  string query = 2;
  uint32 limit = 3;
  string profile = 4;
  // Jina code-embedding task selecting the task-specific query instruction:
  // nl2code, code2code, code2nl, code2completion, or qa. Empty uses the
  // configured default. The task's passage instruction must match the one used
  // to index the snapshot or the search is rejected.
  string task = 5;
}
message SearchHit {
  CodeFact fact = 1;
  float score = 2;
  repeated string chunk_ids = 3;
}
message SearchResponse {
  repeated SearchHit hits = 1;
  uint32 embedded_count = 2;
  uint32 embeddable_count = 3;
}
service SearchService {
  rpc FullText(SearchRequest) returns (SearchResponse);
  rpc Vector(SearchRequest) returns (SearchResponse);
  // Reciprocal rank fusion of lexical and vector retrieval over code Facts.
  rpc Hybrid(SearchRequest) returns (SearchResponse);
}
// AnalysisService persists and serves grouping decisions produced downstream.
// The indexer never infers a grouping; it records the decision, its provenance,
// and the member Facts so results survive reindexing and can be compared.
service AnalysisService {
  rpc SaveAnalysis(AnalysisRequest) returns (AnalysisResult);
  rpc ListRuns(AnalysisRunFilter) returns (AnalysisRunPage);
  rpc ListGroups(GroupFilter) returns (GroupPage);
  rpc ListGroupFacts(GroupFactsRequest) returns (CodeFactPage);
}
