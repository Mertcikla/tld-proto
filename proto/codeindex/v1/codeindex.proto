syntax = "proto3";

package codeindex.v1;

import "diag/v1/workspace_service.proto";
import "google/protobuf/empty.proto";

option go_package = "buf.build/gen/go/tldiagramcom/diagram/protocolbuffers/go/codeindex/v1;codeindexv1";

// Codeindex exposes an immutable, snapshot-scoped code graph. A CodeFact is a
// code-bearing declaration; an EdgeFact is one observed relationship between
// CodeFacts. Stable logical keys join CodeFacts and EdgeFacts across snapshots,
// so consumers can diff revisions, trace observations, and carry analysis
// results forward. The indexer produces this data in-process; it does not infer
// architecture, and diagram conversion is deterministic and lives downstream.
//
// Two services front this graph:
//   - RepositoryService owns repository lifecycle: registration, settings, Git,
//     pull requests, and the per-repository watcher.
//   - CodeIndexService reads the graph, diffs snapshots, and runs the mapper
//     and impact pipelines.
//
// Shared primitives (ID, Progress, Revision) replace the per-RPC wrappers that
// previously duplicated them. Impact scene messages reuse the workspace types
// from diag.v1 so the transient scene speaks the same shape as the workspace.

// ─── Shared primitives ───────────────────────────────────────────────────────

// ID addresses one entity by its opaque server-generated identifier. It is the
// canonical request for lookups that need nothing else.
message ID {
  string id = 1;
}

// Progress reports coarse indexing or mapping progress.
message Progress {
  string stage = 1;
  uint32 current = 2;
  uint32 total = 3;
  string detail = 4;
}

// Revision selects one indexed revision: a published snapshot, a Git commit, or
// the working tree. Exactly one selector is meaningful; snapshot_id wins when
// both it and a Git selector are set.
message Revision {
  string snapshot_id = 1;
  string git_revision = 2;
  bool working_tree = 3;
  // Branch context captured for a commit selected through the history browser.
  string git_branch = 4;
}

// ─── Graph domain ────────────────────────────────────────────────────────────

// Zero-based UTF-8 byte offsets; end positions are exclusive.
message SourceAnchor {
  string path = 1;
  uint32 start_byte = 2;
  uint32 end_byte = 3;
  uint32 start_line = 4;
  uint32 start_column = 5;
  uint32 end_line = 6;
  uint32 end_column = 7;
  string source_hash = 8;
}

message Evidence {
  string producer = 1;
  string version = 2;
  string original_id = 3;
  string original_range = 4;
  SourceAnchor anchor = 5;
  string derivation = 6;
}

enum FactKind {
  FACT_KIND_UNSPECIFIED = 0;
  FACT_KIND_FUNCTION = 1;
  FACT_KIND_METHOD = 2;
  FACT_KIND_CLASS = 3;
  FACT_KIND_STRUCT = 4;
  FACT_KIND_INTERFACE = 5;
  FACT_KIND_ENUM = 6;
  FACT_KIND_TYPE = 7;
  FACT_KIND_CONSTRUCTOR = 8;
  FACT_KIND_FILE = 9;
  // Infrastructure, configuration, and repository-level facts. These carry a
  // subject/object pair rather than a captured code body and are produced by
  // deterministic config scanners, not the code indexers.
  FACT_KIND_DEPLOYABLE = 20;
  FACT_KIND_DEPENDENCY = 21;
  FACT_KIND_ROUTE = 22;
  FACT_KIND_OUTBOUND = 23;
  FACT_KIND_DATASTORE = 24;
  FACT_KIND_QUEUE = 25;
  FACT_KIND_TOPIC = 26;
  FACT_KIND_ENV = 27;
  FACT_KIND_ENTRYPOINT = 28;
  FACT_KIND_CATALOG_COMPONENT = 30;
  FACT_KIND_WORKSPACE_MEMBER = 31;
  FACT_KIND_RPC = 32;
  FACT_KIND_PERSON = 33;
  FACT_KIND_BRIDGE_HTTP = 34;
  FACT_KIND_IMPORT = 39;
  FACT_KIND_CONFIG_REF = 43;
  FACT_KIND_DB_CLIENT = 47;
  FACT_KIND_SCHEMA = 48;
}

// Only captured code-bearing declarations are published as CodeFacts.
message CodeFact {
  string id = 1;
  string repository_id = 2;
  string snapshot_id = 3;
  string language = 4;
  SourceAnchor anchor = 5;
  FactKind kind = 6;
  string name = 7;
  string qualified_name = 8;
  string symbol_key = 9;
  string signature = 10;
  string documentation = 11;
  string body_hash = 12;
  string parent_fact_id = 13;
  repeated Evidence evidence = 14;
  // Import paths declared by the fact's source file, in declaration order.
  repeated string imports = 15;
  // Stable identity that survives across snapshots, enabling cross-snapshot joins.
  string logical_key = 16;
}

enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_REFERENCES = 1;
  EDGE_KIND_CALLS = 2;
  EDGE_KIND_IMPLEMENTS = 3;
  EDGE_KIND_TYPE_DEFINITION = 4;
}

// One observed relationship, including its site and unresolved target key.
message EdgeFact {
  string id = 1;
  string repository_id = 2;
  string snapshot_id = 3;
  EdgeKind kind = 4;
  string from_fact_id = 5;
  string to_fact_id = 6;
  string target_symbol_key = 7;
  SourceAnchor anchor = 8;
  repeated Evidence evidence = 9;
  // Stable identity across snapshots: kind|from-logical-key|target-logical-key.
  string logical_key = 10;
  // Observation count for this logical edge (separate observations remain separate records).
  double weight = 11;
}

message Project {
  string root = 1;
  string language = 2;
  string config_path = 3;
}

message SourceFile {
  string path = 1;
  string hash = 2;
  uint64 size = 3;
  // Git mode when used in a snapshot manifest; empty on captured sources.
  string mode = 4;
}

// Complete file inventory, independent of indexer language/size exclusions.
message SnapshotManifest {
  repeated SourceFile files = 1;
  bool complete = 2;
  string reason = 3;
}

// ─── Repository ──────────────────────────────────────────────────────────────

// Repository is a registered repository plus a summary of its latest snapshot.
message Repository {
  string id = 1;
  string root = 2;
  string latest_snapshot_id = 3;
  int64 latest_created_unix = 4;
  string git_revision = 5;
  string git_branch = 6;
  uint32 facts = 7;
  uint32 edges = 9;
  uint32 sources = 10;
  // Canonical browser URL of the repository's default remote when the checkout
  // has one (for example https://github.com/owner/repo). Empty otherwise.
  string remote_url = 11;
  // Display name for the repository, derived from the remote or root basename.
  string name = 12;
  // True when tld cloned and owns the checkout (see AddRepositoryRequest.remote_url).
  bool managed = 13;
}

// Unset fields inherit global map defaults. Update replaces all overrides.
message RepositoryMapConfiguration {
  optional double resolution = 1;
  optional uint32 min_group_size = 2;
  optional uint32 min_root_groups = 3;
  optional uint32 max_root_groups = 4;
  optional uint32 max_children = 5;
  optional uint32 max_depth = 6;
  optional uint32 max_leaf_files = 7;
  optional uint32 max_connectors_per_view = 8;
  optional uint32 max_leaf_connectors_per_view = 9;
  optional bool include_external_imports = 10;
  optional bool cross_view_connectors = 11;
  optional uint32 cross_view_max_views = 12;
  optional uint32 cross_view_max_elements_per_view = 13;
  optional uint32 cross_view_max_connectors_per_view = 14;
  optional uint32 cross_view_max_connectors_per_element = 15;
}

message RepositoryRemote {
  string name = 1;
  repeated string fetch_urls = 2;
  repeated string push_urls = 3;
}

message RepositorySettings {
  RepositoryMapConfiguration map_defaults = 1;
  RepositoryMapConfiguration map_overrides = 2;
  RepositoryMapConfiguration effective_map = 3;
  repeated RepositoryRemote remotes = 4;
  bool is_git = 5;
  string current_branch = 6;
  string head_sha = 7;
  // Set when changed global defaults conflict with persisted repository overrides.
  // Settings remain readable so the user can repair or clear the overrides.
  string map_validation_error = 8;
}

// ─── Snapshots ───────────────────────────────────────────────────────────────

// Snapshot is an immutable indexed revision of a repository. It is published
// only after ingestion completes, and the repository's latest pointer advances
// to it.
message Snapshot {
  string id = 1;
  string repository_id = 2;
  int64 created_unix = 3;
  string git_revision = 4;
  repeated Project projects = 5;
  repeated SourceFile sources = 6;
  string ingestion_status = 7;
  repeated string warnings = 9;
  // External tool versions and internal relationshipVersion,
  // syntaxCacheVersion, and scipArtifactVersion stamps.
  map<string, string> tool_versions = 10;
  string config_hash = 11;
  // Git branch the working tree was on when the snapshot was captured.
  string git_branch = 12;
  // commit, working_tree, or empty for snapshots with unknown legacy provenance.
  string provenance = 13;
  // Hash of the source manifest, HEAD, and indexing configuration.
  string content_fingerprint = 14;
  // Counts of records belonging to this snapshot, populated when reading it.
  SnapshotStatistics statistics = 15;
  // Subject line of the Git commit at git_revision when the snapshot was
  // captured. Empty for non-Git repositories.
  string commit_message = 16;
  SnapshotManifest manifest = 17;
  // Computed by the serving backend against its current extraction versions.
  // Incompatible snapshots are deletion-only and must be recaptured for use.
  bool compatible = 18;
  string incompatibility_reason = 19;
}

message SnapshotStatistics {
  uint32 facts = 1;
  uint32 edges = 2;
  uint32 sources = 3;
}

message IndexRequest {
  string directory = 1;
  repeated string project_roots = 2;
  repeated string exclude = 3;
  map<string, string> scip_artifacts = 4;
  bool detached = 5;
  // When true and the repository has a published snapshot, facts and edges for
  // sources whose content is unchanged are carried forward. An indexer re-runs
  // only for projects with changed sources, and its unchanged documents are
  // skipped. A snapshot with no changes is reused verbatim.
  bool incremental = 6;
}

// ─── Diffs ───────────────────────────────────────────────────────────────────

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_REMOVED = 2;
  CHANGE_KIND_MODIFIED = 3;
}

message SourceChange {
  string path = 1;
  ChangeKind change = 2;
  string from_hash = 3;
  string to_hash = 4;
  optional uint32 lines_added = 5;
  optional uint32 lines_removed = 6;
  // The file is covered by the manifest but lacks captured source contents.
  bool facts_unavailable = 7;
  bool metadata_only = 8;
}

// Deltas are keyed by stable logical identity, so a rename is an add plus a
// remove and a changed body is a modification.
message CodeFactDelta {
  repeated CodeFact added = 1;
  repeated CodeFact removed = 2;
  repeated CodeFact modified = 3;
}

// EdgeFactDelta compares relationships at the logical-edge level. A logical
// edge present in both snapshots is modified when its observation count changes.
message EdgeFactDelta {
  repeated EdgeFact added = 1;
  repeated EdgeFact removed = 2;
  repeated EdgeFact modified = 3;
}

message SnapshotDiffRequest {
  string repository_id = 1;
  string from_snapshot_id = 2;
  string to_snapshot_id = 3;
  // When true, source changes are returned and CodeFact/EdgeFact deltas are omitted.
  bool sources_only = 4;
}

message SnapshotDiff {
  string repository_id = 1;
  string from_snapshot_id = 2;
  string to_snapshot_id = 3;
  string from_git_revision = 4;
  string to_git_revision = 5;
  repeated SourceChange sources = 6;
  CodeFactDelta facts = 7;
  EdgeFactDelta edge_facts = 8;
}

// ─── Watcher ─────────────────────────────────────────────────────────────────

// WatchStatus is the exact, shared state of a repository's watcher.
message WatchStatus {
  string repository_id = 1;
  bool running = 2;
  bool managed = 3;
  string state = 4;
  string stage = 5;
  string owner_kind = 6;
  int64 owner_pid = 7;
  string repo_root = 8;
  string git_branch = 9;
  string git_revision = 10;
  string snapshot_id = 11;
  string content_fingerprint = 12;
  uint32 changed_files = 13;
  uint32 pending_files = 14;
  int64 started_unix = 15;
  int64 last_scan_unix = 16;
  int64 last_scan_ms = 17;
  int64 heartbeat_unix = 18;
  bool stop_requested = 19;
  int64 poll_interval_ms = 20;
  int64 debounce_ms = 21;
  string error = 22;
  // Whether a standalone `tld` CLI is available to spawn a watcher. False on
  // desktop builds without an installed CLI.
  bool cli_available = 23;
  string install_hint = 24;
}

// ─── Git ─────────────────────────────────────────────────────────────────────

// Git references describe current local refs, not a snapshot's captured branch.
message GitCommit {
  string sha = 1;
  string subject = 2;
  string author = 3;
  string author_email = 4;
  int64 created_unix = 5;
  repeated string parents = 6;
  repeated string refs = 7;
  string body = 8;
}

message GitBranch {
  string name = 1;
  string sha = 2;
}

message CommitFileChange {
  string path = 1;
  uint32 added = 2;
  uint32 removed = 3;
  bool binary = 4;
}

message OpenPullRequest {
  uint32 number = 1;
  string title = 2;
  string url = 3;
  string base_branch = 4;
  string head_branch = 5;
}

// ─── Indexers ────────────────────────────────────────────────────────────────

// IndexerRequirement reports one external SCIP indexer a repository needs,
// derived from the project families discovered in it.
message IndexerRequirement {
  // Indexer family: go, web, python, dotnet, clang, jvm, dart, php, ruby, rust.
  string family = 1;
  // Executable the pipeline resolves on PATH (for example scip-go).
  string tool = 2;
  // Detected project languages that mapped to this family.
  repeated string languages = 3;
  // Whether the tool is available with the current configuration. Language
  // servers must also complete an LSP initialize/shutdown health check.
  bool installed = 4;
  // Copy-pasteable install command for the tool.
  string install_hint = 5;
  // Version reported by the installed executable; empty when unresolved or
  // when the tool does not report one.
  string version = 6;
  // Lowest version the pipeline is tested against. Empty when no minimum is
  // declared. Older tools still run, but may emit less symbol metadata.
  string min_version = 7;
  // The detected version is older than min_version. Advisory.
  bool below_minimum = 8;
  // Release or package page a user can download the tool from.
  string download_url = 9;
  // Resolved executable path when found.
  string path = 10;
  // Executable resolution or health-check failure; empty when available.
  string check_error = 11;
}

// ─── Impact ──────────────────────────────────────────────────────────────────

enum ImpactOrigin {
  IMPACT_ORIGIN_UNSPECIFIED = 0;
  IMPACT_ORIGIN_AUTHORED = 1;
  IMPACT_ORIGIN_MAPPED = 2;
  IMPACT_ORIGIN_RAW = 3;
}

enum ImpactGrounding {
  IMPACT_GROUNDING_UNSPECIFIED = 0;
  IMPACT_GROUNDING_RESOLVED = 1;
  IMPACT_GROUNDING_UNLINKED = 2;
  IMPACT_GROUNDING_UNRESOLVED = 3;
  IMPACT_GROUNDING_OUTSIDE_REPOSITORY = 4;
  IMPACT_GROUNDING_AMBIGUOUS = 5;
  IMPACT_GROUNDING_MANIFEST_ONLY = 6;
}

enum ImpactRole {
  IMPACT_ROLE_UNSPECIFIED = 0;
  IMPACT_ROLE_DIRECT = 1;
  IMPACT_ROLE_CONTAINED = 2;
  IMPACT_ROLE_DEPENDENCY_CONTEXT = 3;
  IMPACT_ROLE_AUTHORED_CONTEXT = 4;
  IMPACT_ROLE_CONTAINER = 5;
}

// Canonical portable comparison, shared by CLI, RPC, canvas and Mermaid.
// Debug evidence is optional; rendering never depends on it.
message ImpactScene {
  repeated diag.v1.View tree = 1;
  map<string, SceneViewContent> views = 2;
  repeated diag.v1.ElementNavigationInfo navigations = 3;
  ImpactComparison comparison = 4;
  repeated ImpactFile files = 5;
  map<string, ImpactSymbolChange> symbols = 6;
  ImpactSummary summary = 7;
  optional ImpactAudit provenance = 8;
}

message ImpactComparison {
  string repository_id = 1;
  string key = 2;
  string version = 3;
  string schema_version = 4;
  string base = 5;
  string head = 6;
  repeated ImpactCommit commits = 7;
  // available, partial, unavailable, or not_applicable. Stats are net tree churn.
  string git_status = 8;
  string git_unavailable_reason = 9;
  uint32 requested_radius = 10;
  uint32 effective_radius = 11;
  bool plain = 12;
  bool manifest_complete = 13;
  repeated string warnings = 14;
  // Short workspace references omitted by the selected radius or Plain mode.
  repeated string omitted_context = 15;
  string repository_name = 16;
  string view_filter = 17;
  uint32 node_budget = 18;
  uint32 byte_budget = 19;
}

message ImpactCommit {
  string sha = 1;
  string subject = 2;
  string author = 3;
  int64 created_unix = 4;
}

// References use the existing numeric workspace identity, not hash aliases.
message ImpactPlacementRef {
  int32 view_id = 1;
  int32 element_id = 2;
}

message ImpactFile {
  string path = 1;
  ChangeKind change = 2;
  optional uint32 lines_added = 3;
  optional uint32 lines_removed = 4;
  string line_counts_basis = 5;
  bool binary = 6;
  bool metadata_only = 7;
  // captured, manifest_only, absent, or unknown on each snapshot side.
  string base_analysis = 8;
  string head_analysis = 9;
  string analysis_unavailable_reason = 10;
  repeated ImpactPlacementRef representatives = 11;
  repeated string symbols = 12;
  // Content identities let live viewers distinguish successive edits even when
  // line counts and symbol names stay the same. No source text is included.
  string base_hash = 13;
  string head_hash = 14;
}

message ImpactSymbolChange {
  ChangeKind change = 1;
  string name = 2;
  FactKind kind = 3;
  // Lines are zero-based; absent path means no captured location.
  string path = 4;
  uint32 start_line = 5;
  uint32 end_line = 6;
}

message ImpactSceneOverlay {
  ChangeKind change = 1;
  string path = 2;
  optional uint32 lines_added = 3;
  optional uint32 lines_removed = 4;
  bool contained = 5;
  repeated string symbol_refs = 6;
}

message ScenePlacement {
  diag.v1.PlacedElement element = 1;
  optional ImpactSceneOverlay overlay = 2;
  ImpactOrigin origin = 3;
  ImpactRole role = 4;
  ImpactGrounding grounding = 5;
  uint32 distance = 6;
}

message SceneViewContent {
  repeated ScenePlacement placements = 1;
  repeated diag.v1.Connector connectors = 2;
  map<string, ImpactPlacementRef> connector_targets = 3;
}

message ImpactSummary {
  uint32 files = 1;
  uint32 known_lines_added = 2;
  uint32 known_lines_removed = 3;
  bool line_counts_complete = 4;
  uint32 binary_files = 5;
  uint32 affected_placements = 6;
  uint32 dependency_neighbours = 7;
  uint32 authored_context = 8;
  uint32 containers = 9;
  uint32 ungrounded = 10;
  uint32 indexed_symbol_changes = 11;
  uint32 displayed_symbol_changes = 12;
  uint32 excluded_symbol_changes = 13;
  string line_counts_basis = 14;
}

// Matching evidence is captured at the decision, not reconstructed by exporters.
message ImpactMatch {
  string path = 1;
  ImpactPlacementRef placement = 2;
  string source_link = 3;
  string scope = 4;
  // file, folder, symbol, line, fallback, unresolved, or ambiguous.
  string kind = 5;
  bool partial = 6;
  string side = 7;
  string outcome = 8;
  string reason = 9;
  repeated ImpactPlacementRef representatives = 10;
}

message ImpactAuditDecision {
  string stage = 1;
  string action = 2;
  // Short workspace reference: v2/e2, v2/c3, or v2.
  string target = 3;
  string reason = 4;
  repeated ImpactPlacementRef representatives = 5;
}

message ImpactDependencyWitness {
  // base or head; paths never combine observations from different sides.
  string side = 1;
  repeated string paths = 2;
}

message ImpactDependency {
  string from_path = 1;
  string to_path = 2;
  string side = 3;
  repeated EdgeKind kinds = 4;
  double observations = 5;
}

message ImpactAudit {
  repeated ImpactMatch matches = 1;
  repeated ImpactAuditDecision decisions = 2;
  repeated ImpactDependencyWitness witnesses = 3;
  repeated ImpactDependency dependencies = 4;
  map<string, string> excluded_symbols = 5;
  map<string, string> references = 6;
  // Persisted workspace relationships; these may exist without any observed
  // source dependency. Observations above make a separate evidence claim.
  repeated string declared_connectors = 7;
}

message LiveImpact {
  bool watching = 1;
  string error = 2;
  string git_branch = 3;
  string git_revision = 4;
  // On WatchLiveImpact, omitted when only watcher status changed.
  // Subscribers retain the last scene until a new scene is received.
  ImpactScene scene = 5;
  WatchStatus watch_status = 6;
}

// A subscription always starts with the latest persisted scene. Scene updates
// replace it atomically; slow subscribers may skip intermediate revisions.
message WatchLiveImpactRequest {
  string repository_id = 1;
  bool debug_provenance = 2;
  bool plain = 3;
}

// Invalidates subscribers after a CLI scan or watcher status write commits.
// The server reads its own persisted state; publishers cannot inject scenes.
message PublishLiveImpactRequest {
  string repository_id = 1;
}

message MapResult {
  string run_id = 1;
  int64 view_id = 2;
  uint32 facts = 3;
  uint32 clusters = 4;
  uint32 bins = 5;
  uint32 unclustered = 6;
  double weighted_tightness = 7;
  string snapshot_id = 8;
}

// Only successful materializations are returned as completed maps.
message CompletedMap {
  MapResult result = 1;
  int64 completed_unix = 2;
  // Whether the completed run materialized external imports.
  bool include_imports = 4;
  string config_hash = 5;
}

// ─── RepositoryService messages ──────────────────────────────────────────────

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

// Reads current worktree content for source previews, confined to a registered
// repository. This does not read immutable snapshot content.
message GetWorktreeSourceRequest {
  string repository_id = 1;
  // Local path or remote URL used by legacy workspace source links.
  string repo = 2;
  string file_path = 3;
}

message GetWorktreeSourceResponse {
  string content = 1;
  string path = 2;
}

message UpdateRepositoryMapConfigurationRequest {
  string repository_id = 1;
  RepositoryMapConfiguration overrides = 2;
}

// Changes the local Git checkout's remote configuration, without network I/O.
// Replaces the remote's URL lists; remove deletes the named remote instead.
message UpdateRepositoryRemoteRequest {
  string repository_id = 1;
  RepositoryRemote remote = 2;
  bool remove = 3;
}

message DeleteRepositoryRequest {
  string id = 1;
  // When set, also deletes the workspace views, elements, and connectors that
  // were materialized from this repository. When unset, only the repository and
  // its snapshots are deleted and materialized resources remain in the
  // workspace.
  bool delete_materialized = 2;
  // When set and the repository is a tld-managed clone, also deletes the local
  // checkout. Ignored for repositories registered from user-provided paths.
  bool delete_clone = 3;
}

message AddRepositoryRequest {
  // Absolute local filesystem path to the repository directory to index.
  string path = 1;
  // Remote Git URL (or GitHub owner/repo shorthand) to clone into tld-managed
  // storage and index. Mutually exclusive with path. Credentials embedded in
  // the URL are rejected.
  string remote_url = 2;
  // When set, projects the published snapshot into the workspace after
  // indexing.
  bool materialize = 3;
}

message AddRepositoryEvent {
  oneof event {
    Progress progress = 1;
    Repository repository = 2;
  }
}

// CheckRepositoryIndexersRequest identifies a repository to inspect. Exactly
// one of path or remote_url must be set.
message CheckRepositoryIndexersRequest {
  string path = 1;
  string remote_url = 2;
}

message CheckRepositoryIndexersResponse {
  repeated IndexerRequirement indexers = 1;
  // True when every required indexer is installed.
  bool ready = 2;
}

message StartWatchRequest {
  string repository_id = 1;
  // Passed through to the spawned watcher. Zero uses the CLI defaults.
  bool materialize = 2;
}

// GitHistoryRequest scopes the history to a repository. An empty branch uses the
// current branch; zero limit uses the server default.
message GetGitHistoryRequest {
  string repository_id = 1;
  string branch = 2;
  uint32 limit = 3;
}

message GetGitHistoryResponse {
  repeated GitCommit commits = 1;
  repeated GitBranch branches = 2;
  string head_sha = 3;
  string current_branch = 4;
  bool has_more = 5;
  bool is_git = 6;
  // Browser URL derived from the checkout origin, without embedded credentials.
  string repository_url = 7;
}

// Resolves a GitHub PR through the local gh CLI and fetches its commits for review.
message GetPullRequestRequest {
  string repository_id = 1;
  // PR number or URL, scoped to this repository's origin.
  string pull_request = 2;
}

message GetPullRequestResponse {
  string title = 1;
  string url = 2;
  string base_sha = 3;
  string head_sha = 4;
  string base_branch = 5;
  string head_branch = 6;
}

message ListPullRequestsResponse {
  repeated OpenPullRequest pull_requests = 1;
}

message GetCommitDetailsRequest {
  string repository_id = 1;
  string revision = 2;
}

message GetCommitDetailsResponse {
  GitCommit commit = 1;
  repeated CommitFileChange files = 2;
}

// GetRevisionRangeSummaryRequest asks for a lightweight diff summary between two
// targets. It neither indexes nor builds a map. A side is a commit-ish revision
// unless its working_tree flag is set, in which case it compares the checkout's
// working tree.
message GetRevisionRangeSummaryRequest {
  string repository_id = 1;
  string base = 2;
  string head = 3;
  bool base_working_tree = 4;
  bool head_working_tree = 5;
}

// RevisionRangeSummary is the commit count and line-level diffstat for a
// revision range, surfaced in the commit history footer before a full compare.
message RevisionRangeSummary {
  uint32 commits = 1;
  uint32 additions = 2;
  uint32 deletions = 3;
  // Lines added or removed in files modified between the two revisions.
  uint32 changed = 4;
  // Number of files changed.
  uint32 files = 5;
}

// ─── CodeIndexService messages ───────────────────────────────────────────────

message CodeFactFilter {
  string repository_id = 1;
  string snapshot_id = 2;
  string language = 3;
  FactKind kind = 4;
  string path_prefix = 5;
  uint32 page_size = 6;
  string page_token = 7;
}

message CodeFactPage {
  repeated CodeFact facts = 1;
  string next_page_token = 2;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

// CaptureSnapshotRequest indexes a repository and publishes a new snapshot.
message CaptureSnapshotRequest {
  string repository_id = 1;
  // When set, the checkout's working tree is indexed, including uncommitted
  // changes, and published as a manual snapshot. When unset, the current Git
  // commit is indexed; the repository must be a Git checkout with at least one
  // commit.
  bool working_tree = 2;
}

message CaptureSnapshotEvent {
  oneof event {
    Progress progress = 1;
    Snapshot snapshot = 2;
  }
}

message MapRepositoryRequest {
  string repository_id = 1;
  // Optional revision; the repository's latest published snapshot when unset.
  Revision revision = 2;
  // When set, external imports declared by the indexed files are materialized
  // under an External element and connected to the files that import them. Off
  // by default: external imports can dominate the map's connector budget.
  bool include_imports = 3;
}

message MapRepositoryEvent {
  oneof event {
    Progress progress = 1;
    MapResult result = 2;
  }
}

message ListMapsResponse {
  repeated CompletedMap maps = 1;
}

// A comparison target uses the same selection semantics as MapRepository.
message CompareRepositoryRequest {
  string repository_id = 1;
  Revision base = 2;
  Revision head = 3;
  // Dependency hops of unchanged context to include (blast radius).
  // Zero means direct changes only; scene selection is performed by the server.
  uint32 context_depth = 4;
  bool debug_provenance = 5;
  string view_filter = 6;
}

message CompareRepositoryEvent {
  oneof event {
    Progress progress = 1;
    ImpactScene result = 2;
  }
}

message ExportImpactMermaidRequest {
  string repository_id = 1;
  string comparison_key = 2;

  bool markdown = 4;
  // Plain view: hide elements that were not changed.
  bool plain = 5;
}

message ExportImpactMermaidResponse {
  string code = 1;
  string markdown = 2;
  repeated string warnings = 3;
}

message GetImpactSceneRequest {
  string repository_id = 1;
  string comparison_key = 2;
  bool debug_provenance = 3;
  bool plain = 4;
}

// ─── Services ────────────────────────────────────────────────────────────────

// RepositoryService lists, adds, and deletes the repositories indexed by the
// in-process codeindex engine, and manages their settings, Git history, pull
// requests, and watchers.
service RepositoryService {
  rpc ListRepositories(google.protobuf.Empty) returns (ListRepositoriesResponse);
  rpc GetWorktreeSource(GetWorktreeSourceRequest) returns (GetWorktreeSourceResponse);
  rpc GetRepositorySettings(ID) returns (RepositorySettings);
  rpc UpdateRepositoryMapConfiguration(UpdateRepositoryMapConfigurationRequest) returns (RepositorySettings);
  rpc UpdateRepositoryRemote(UpdateRepositoryRemoteRequest) returns (RepositorySettings);
  rpc CheckRepositoryIndexers(CheckRepositoryIndexersRequest) returns (CheckRepositoryIndexersResponse);
  rpc AddRepository(AddRepositoryRequest) returns (stream AddRepositoryEvent);
  rpc DeleteRepository(DeleteRepositoryRequest) returns (google.protobuf.Empty);
  rpc GetGitHistory(GetGitHistoryRequest) returns (GetGitHistoryResponse);
  rpc GetCommitDetails(GetCommitDetailsRequest) returns (GetCommitDetailsResponse);
  rpc GetRevisionRangeSummary(GetRevisionRangeSummaryRequest) returns (RevisionRangeSummary);
  rpc GetPullRequest(GetPullRequestRequest) returns (GetPullRequestResponse);
  rpc ListPullRequests(ID) returns (ListPullRequestsResponse);
  rpc StartWatch(StartWatchRequest) returns (WatchStatus);
  rpc StopWatch(ID) returns (WatchStatus);
  rpc GetWatchStatus(ID) returns (WatchStatus);
}

// CodeIndexService captures, reads, and deletes snapshots of the immutable
// code graph, and runs the deterministic mapper and impact pipelines.
service CodeIndexService {
  rpc ListFacts(CodeFactFilter) returns (CodeFactPage);
  rpc ListSnapshots(ID) returns (ListSnapshotsResponse);
  rpc CaptureSnapshot(CaptureSnapshotRequest) returns (stream CaptureSnapshotEvent);
  rpc DiffSnapshots(SnapshotDiffRequest) returns (SnapshotDiff);
  rpc DeleteSnapshot(ID) returns (google.protobuf.Empty);
  rpc MapRepository(MapRepositoryRequest) returns (stream MapRepositoryEvent);
  rpc ListMaps(ID) returns (ListMapsResponse);
  rpc CompareRepository(CompareRepositoryRequest) returns (stream CompareRepositoryEvent);
  rpc GetLiveImpact(ID) returns (LiveImpact);
  rpc WatchLiveImpact(WatchLiveImpactRequest) returns (stream LiveImpact);
  rpc PublishLiveImpact(PublishLiveImpactRequest) returns (google.protobuf.Empty);
  rpc ExportImpactMermaid(ExportImpactMermaidRequest) returns (ExportImpactMermaidResponse);
  rpc GetImpactScene(GetImpactSceneRequest) returns (ImpactScene);
}
