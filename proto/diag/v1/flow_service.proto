syntax = "proto3";

package diag.v1;

option go_package = "buf.build/gen/go/tldiagramcom/diagram/protocolbuffers/go/diag/v1;diagv1";

// Flows are versioned stories over an existing view. Playback never changes
// the underlying elements, connections, or connection directions.
service FlowService {
  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse);
  rpc SaveFlow(SaveFlowRequest) returns (SaveFlowResponse);
  rpc DeleteFlow(DeleteFlowRequest) returns (DeleteFlowResponse);
}

message Flow {
  string id = 1;
  int32 view_id = 2;
  string name = 3;
  string description = 4;
  repeated FlowStep steps = 5;
  int32 revision = 6;
}

message FlowStep {
  string id = 1;
  reserved 2, 5, 6, 7, 8;
  reserved "kind", "connector_id", "element_id", "reverse", "paths";
  string title = 3;
  string description = 4;
  repeated int32 element_ids = 9;
  repeated FlowConnectorHighlight connectors = 10;
  map<string, string> metadata = 11;
}

message FlowConnectorHighlight {
  int32 id = 1;
  // Reverses only this highlight's presentation, never the diagram connection.
  bool reverse = 2;
}

message ListFlowsRequest {
  string org_id = 1;
  // Zero lists all accessible flows in the workspace.
  int32 view_id = 2;
}
message ListFlowsResponse {
  repeated Flow flows = 1;
}
message SaveFlowRequest {
  string org_id = 1;
  // Empty id and revision zero creates a new flow. Updates must carry the
  // current revision; stale writes fail with ABORTED.
  Flow flow = 2;
}
message SaveFlowResponse {
  Flow flow = 1;
}
message DeleteFlowRequest {
  string org_id = 1;
  string id = 2;
  int32 view_id = 3;
  int32 expected_revision = 4;
}
message DeleteFlowResponse {}
